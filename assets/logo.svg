<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b80" />
      <stop offset="50%" stop-color="#0a4bb8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#001a4d" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="110" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" />
  <rect x="24" y="24" width="464" height="464" rx="106" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" />

  <!-- White Central Shield -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" filter="url(#shadow)" stroke="#e2edfa" stroke-width="4" />

  <!-- CNAS Emblem Elements -->
  <!-- Outer Oval Ring -->
  <ellipse cx="256" cy="235" rx="135" ry="110" fill="none" stroke="#003399" stroke-width="9" />

  <!-- Protective Hands / Cradle -->
  <path d="M 150 250 C 150 310, 210 325, 256 325 C 302 325, 362 310, 362 250 C 340 280, 290 295, 256 295 C 222 295, 172 280, 150 250 Z" fill="#003399" />

  <!-- Three Human Figures (Father, Child, Mother) -->
  <!-- Center Figure (Child) -->
  <circle cx="256" cy="210" r="16" fill="#003399" />
  <path d="M 240 265 C 240 235, 272 235, 272 265 Z" fill="#003399" />

  <!-- Left Figure (Father) -->
  <circle cx="218" cy="195" r="20" fill="#003399" />
  <path d="M 194 265 C 194 225, 240 225, 240 265 Z" fill="#003399" />

  <!-- Right Figure (Mother) -->
  <circle cx="294" cy="195" r="20" fill="#003399" />
  <path d="M 272 265 C 272 225, 318 225, 318 265 Z" fill="#003399" />

  <!-- Bold "CNAS" Typography -->
  <text x="256" y="380" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="#003399" text-anchor="middle" letter-spacing="4">CNAS</text>
</svg>
