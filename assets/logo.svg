<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Cal Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Check Badge Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Main Squircle App Icon Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Subtle Gloss / Inner Border -->
  <rect x="25" y="25" width="462" height="462" rx="103" ry="103" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" />

  <!-- Calendar Page Body -->
  <g filter="url(#dropShadow)">
    <rect x="88" y="112" width="336" height="312" rx="36" ry="36" fill="#ffffff" />
  </g>

  <!-- Calendar Header Bar -->
  <path d="M 88 148 Q 88 112 124 112 L 388 112 Q 424 112 424 148 L 424 186 L 88 186 Z" fill="url(#headerGrad)" />

  <!-- Calendar Binder Rings -->
  <!-- Ring 1 -->
  <rect x="156" y="88" width="28" height="52" rx="14" ry="14" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <rect x="162" y="94" width="16" height="40" rx="8" ry="8" fill="#e2e8f0" />
  <!-- Ring 2 -->
  <rect x="328" y="88" width="28" height="52" rx="14" ry="14" fill="#ffffff" stroke="#94a3b8" stroke-width="3" />
  <rect x="334" y="94" width="16" height="40" rx="8" ry="8" fill="#e2e8f0" />

  <!-- Vacation Sun & Umbrella Graphics inside Calendar -->
  <!-- Radiant Sun -->
  <circle cx="330" cy="240" r="46" fill="url(#sunGrad)" opacity="0.95" />
  <!-- Sun Rays -->
  <path d="M 330 178 L 330 188 M 330 292 L 330 302 M 268 240 L 278 240 M 382 240 L 392 240 M 286 196 L 293 203 M 367 277 L 374 284 M 286 284 L 293 277 M 367 203 L 374 196" 
        stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />

  <!-- Umbrella / Vacation Parasol -->
  <!-- Stick -->
  <path d="M 235 242 L 235 368 C 235 382 218 382 218 372" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
  
  <!-- Umbrella Canopy -->
  <!-- Left panel (Teal) -->
  <path d="M 235 238 C 205 238 160 252 148 276 C 168 273 186 276 196 280 C 210 262 225 245 235 238 Z" fill="#0284c7" />
  <!-- Center-Left panel (White) -->
  <path d="M 235 238 C 225 245 210 262 196 280 C 215 284 230 284 235 284 C 235 264 235 245 235 238 Z" fill="#f8fafc" />
  <!-- Center-Right panel (Emerald) -->
  <path d="M 235 238 C 235 245 235 264 235 284 C 240 284 255 284 274 280 C 260 262 245 245 235 238 Z" fill="#10b981" />
  <!-- Right panel (White/Navy) -->
  <path d="M 235 238 C 245 245 260 262 274 280 C 284 276 302 273 322 276 C 310 252 265 238 235 238 Z" fill="#e0f2fe" />
  
  <!-- Umbrella Tip -->
  <path d="M 235 228 L 235 238" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />

  <!-- Tropical Leaf Accent -->
  <path d="M 145 372 C 142 340 162 318 190 312 C 182 328 178 350 176 372 Z" fill="#10b981" opacity="0.85" />
  <path d="M 148 372 C 158 352 176 338 198 332 C 190 348 182 364 172 376 Z" fill="#059669" opacity="0.85" />

  <!-- Calendar Grid Lines Subtle -->
  <line x1="126" y1="392" x2="310" y2="392" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

  <!-- "Approved / Validated" Checkmark Seal Badge in Bottom Right -->
  <g filter="url(#badgeShadow)">
    <circle cx="382" cy="382" r="58" fill="url(#checkGrad)" stroke="#ffffff" stroke-width="6" />
    <!-- Checkmark icon -->
    <path d="M 358 382 L 374 398 L 408 364" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
