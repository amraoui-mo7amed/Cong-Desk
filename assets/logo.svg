<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2d78" />
      <stop offset="45%" stop-color="#154cb8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Calendar Header Gradient -->
    <linearGradient id="calHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#104baf" />
      <stop offset="100%" stop-color="#1d68d8" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#05153a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="url(#bgGrad)" />
  
  <!-- Glass Rim -->
  <rect x="24" y="24" width="464" height="464" rx="110" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25" />
  <rect x="28" y="28" width="456" height="456" rx="106" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- Document / Calendar Body with Shadow -->
  <g filter="url(#softShadow)">
    <rect x="120" y="110" width="272" height="292" rx="28" fill="#ffffff" />
    
    <!-- Calendar Top Banner -->
    <path d="M 120 138 Q 120 110 148 110 L 364 110 Q 392 110 392 138 L 392 185 L 120 185 Z" fill="url(#calHeaderGrad)" />
  </g>

  <!-- Binder Rings -->
  <g fill="#e2edfa" stroke="#6095db" stroke-width="2.5">
    <rect x="179" y="98" width="12" height="28" rx="6" />
    <rect x="250" y="98" width="12" height="28" rx="6" />
    <rect x="321" y="98" width="12" height="28" rx="6" />
  </g>

  <!-- Calendar Schedule Grid Marks -->
  <g fill="#d8e6f8">
    <rect x="151" y="210" width="28" height="12" rx="4" />
    <rect x="211" y="210" width="28" height="12" rx="4" />
    <rect x="271" y="210" width="28" height="12" rx="4" />
    <rect x="331" y="210" width="28" height="12" rx="4" />

    <rect x="151" y="255" width="28" height="12" rx="4" />
    <rect x="331" y="255" width="28" height="12" rx="4" />

    <rect x="151" y="300" width="28" height="12" rx="4" />
    <rect x="211" y="300" width="28" height="12" rx="4" />
    <rect x="271" y="300" width="28" height="12" rx="4" />
    <rect x="331" y="300" width="28" height="12" rx="4" />
  </g>

  <!-- Central Approved Leave Shield / Seal -->
  <circle cx="256" cy="275" r="52" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="4.5" />
  
  <!-- Checkmark -->
  <path d="M 234 273 L 250 290 L 280 258" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Accent Bar -->
  <rect x="160" y="372" width="192" height="10" rx="5" fill="#cadbf2" />
</svg>
